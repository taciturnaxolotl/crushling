name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gleam.toml"
      - "manifest.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same gleam and OTP prattle runs. The prebuilt gleam from
      # setup-beam segfaults compiling slackline.
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix shell github:nixos/nixpkgs/nixos-26.05#{gleam,erlang,rebar3} -c gleam format --check src test
      - run: nix shell github:nixos/nixpkgs/nixos-26.05#{gleam,erlang,rebar3} -c gleam test

  # The unit runs `gleam run`, which compiles on start, so a deploy is a pull
  # and a restart.
  deploy:
    needs: check
    uses: taciturnaxolotl/dots/.github/workflows/deploy-service.yml@main
    with:
      service: crushling
      host: prattle
      install_command: "true"
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
