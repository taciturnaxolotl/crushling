display_information:
  name: crushling
  description: So cuuuuute 💖
  background_color: "#6b50ff"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    agent_tasks_enabled: true
  bot_user:
    display_name: crushling
    always_online: true
  code_channels:
    enabled: true
  agent_view:
    agent_description: So cuuuuute 💖
    suggested_prompts: []
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - chat:write
      - code_channels:manage
      - files:read
      - files:write
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://crushling.dunkirk.sh/slack/events
    bot_events:
      - agent_session_stopped
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://crushling.dunkirk.sh/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  is_mcp_enabled: false
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
